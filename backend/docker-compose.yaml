version: '3.9'

services:
  frontend:
    build:
      context: ./frontend   
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    command: >
      sh -c "python manage.py collectstatic --noinput || true &&
             python manage.py migrate &&
             gunicorn inventory_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
